<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARMATCH AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">CAR<span>MATCH</span> <b>AI</b></div>
  <div class="subtitle">Inteligentný výber automobilov</div>
</header>

<main>

  <section class="hero">
    <div class="eyebrow">AI AUTOMOTIVE SEARCH</div>

    <h1>
      Nájdi svoje<br>
      <em>ideálne auto.</em>
    </h1>

    <p>
      Opíš svoje požiadavky alebo použi filtre.
      CARMATCH AI následne vyhodnotí najvhodnejšie vozidlá.
    </p>
  </section>

  <section class="search-panel">

    <h2>Čo od auta potrebuješ?</h2>

    <label class="ai-label">
      🤖 Napíš požiadavku vlastnými slovami
      <textarea id="aiRequest"
        placeholder="Napr.: Chcem luxusný superšport pre 2 osoby, minimálne 300 kW, 4x4, do 300 000 €, čo najnovšiu generáciu..."></textarea>
    </label>

    <div class="divider">
      <span>alebo použi filtre</span>
    </div>

    <div class="grid">

      <label>
        Rozpočet (€)
        <input id="budget" type="number" placeholder="300000">
      </label>

      <label>
        Počet miest
        <input id="seats" type="number" placeholder="2">
      </label>

      <label>
        Min. výkon (kW)
        <input id="power" type="number" placeholder="300">
      </label>

      <label>
        Min. kufor (l)
        <input id="trunk" type="number" placeholder="300">
      </label>

      <label>
        Pohon
        <select id="drive">
          <option>Ľubovoľný</option>
          <option>4x4</option>
          <option>4x2</option>
        </select>
      </label>

      <label>
        Palivo / pohon
        <select id="fuel">
          <option>Ľubovoľný</option>
          <option>Benzín</option>
          <option>Diesel</option>
          <option>Hybrid</option>
          <option>Elektrické</option>
        </select>
      </label>

      <label>
        Karoséria
        <select id="body">
          <option>Ľubovoľná</option>
          <option>SUV</option>
          <option>Kombi</option>
          <option>Sedan</option>
          <option>Kupé</option>
          <option>Roadster</option>
          <option>Superšport</option>
          <option>Hatchback</option>
        </select>
      </label>

      <label>
        Vzhľad
        <select id="style">
          <option>Ľubovoľný</option>
          <option>Športový</option>
          <option>Luxusný</option>
          <option>Elegantný</option>
        </select>
      </label>

      <label>
        Maximálna dĺžka (m)
        <input id="length" type="number" step="0.01" placeholder="5">
      </label>

      <label>
        Modelový rok
        <select id="year">
          <option>Najnovší</option>
          <option>2027</option>
          <option>2026</option>
          <option>2025</option>
        </select>
      </label>

      <label class="wide">
        Nechcené značky
        <input id="avoid" placeholder="Napr. BMW, Dacia">
      </label>

    </div>

    <button id="searchButton" class="find">
      🤖 NÁJSŤ MOJE TOP 3 AUTÁ
      <span>→</span>
    </button>

    <div id="status" class="status"></div>

  </section>

  <section id="results"></section>

</main>

<footer>
  CARMATCH AI — inteligentný automobilový vyhľadávač
</footer>

<script src="app.js"></script>

</body>
</html>
